name: Check

on:
  # No paths-ignore: a skipped workflow never reports, which would leave a
  # required check pending on docs-only pull requests.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      lock-artifact:
        description: Name of an uploaded artifact containing flake.lock to check instead of the committed one
        type: string
        default: ""

concurrency:
  group: check-${{ github.ref }}-${{ inputs.lock-artifact }}
  # Only superseded pull request pushes are cancelled; main and update runs finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  flake-check:
    name: nix flake check (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # Each host's check builds on its own system, so native runners need no emulation.
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: inputs.lock-artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.lock-artifact }}

      # The desktop closures don't fit in the default free space on the x86_64 runner.
      - if: matrix.system == 'x86_64-linux'
        uses: wimpysworld/nothing-but-nix@b2574ec1cf1462bee0a34de0fb6ff11ad3c43cb2 # v12
        with:
          hatchet-protocol: carve

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # Caches what cache.nixos.org lacks (unfree drivers, the Pi kernel, patched
      # and local packages) in the GitHub Actions cache. That cache holds about
      # 10 GB and evicts, so heavy paths are sometimes rebuilt.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
        with:
          use-flakehub: false

      # Optional persistent cache. Skipped unless the CACHIX_NAME variable is set;
      # pushes only when the CACHIX_AUTH_TOKEN secret is also available.
      - if: vars.CACHIX_NAME != ''
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: ${{ vars.CACHIX_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - run: nix flake check --print-build-logs --keep-going
