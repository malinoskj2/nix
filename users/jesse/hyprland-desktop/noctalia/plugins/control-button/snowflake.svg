<svg xmlns="http://www.w3.org/2000/svg" width="535" height="535" viewBox="0 0 501.56252 501.56251">
  <!--
    Adapted from https://github.com/NixOS/nixos-artwork/blob/master/logo/nix-snowflake-white.svg.
    Its gradients become one color per lambda, and render.py fills in each @lambdaN@ placeholder.
  -->
  <defs>
    <path id="lambda-a" fill-rule="evenodd" d="m 449.71876,-420.51322 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8257 z"/>
    <path id="lambda-b" fill-rule="evenodd" d="m 309.54892,-710.38827 122.19683,211.67512 -56.15706,0.5268 -32.6236,-56.8692 -32.85645,56.5653 -27.90237,-0.011 -14.29086,-24.6896 46.81047,-80.4901 -33.22946,-57.8256 z"/>
  </defs>
  <!--
    The chained transforms are the original's nested group transforms; one merged matrix rounds
    differently and shifts the rendered pixels. The <use> order is the original's paint order, which
    decides where the lambdas overlap.
  -->
  <g transform="translate(-156.48372,537.56136) matrix(0.09048806,0,0,0.09048806,142.32381,-419.8252) matrix(11.047619,0,0,11.047619,-1572.2888,9377.7107)">
    <use href="#lambda-a" fill="#@lambda2@" transform="rotate(-60,226.35754,-449.37199)"/>
    <use href="#lambda-b" fill="#@lambda3@"/>
    <use href="#lambda-a" fill="#@lambda4@" transform="rotate(60,728.23563,-692.24036)"/>
    <use href="#lambda-a" fill="#@lambda6@" transform="rotate(180,477.5036,-570.81898)"/>
    <use href="#lambda-b" fill="#@lambda5@" transform="rotate(120,407.33916,-716.08356)"/>
    <use href="#lambda-b" fill="#@lambda1@" transform="rotate(-120,407.28823,-715.86995)"/>
  </g>
</svg>
