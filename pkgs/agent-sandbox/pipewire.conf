context.objects = [
  { factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "sandbox-speaker"
      node.description = "Sandbox Speaker"
      media.class = "Audio/Sink"
      audio.position = [ FL FR ]
      priority.session = 2000
      priority.driver = 2000
      monitor.channel-volumes = true
      object.linger = true
    }
  }
  { factory = adapter
    args = {
      factory.name = support.null-audio-sink
      node.name = "sandbox-mic-feed"
      node.description = "Sandbox Microphone Feed"
      media.class = "Audio/Sink"
      audio.position = [ MONO ]
      priority.session = 100
      priority.driver = 100
      object.linger = true
    }
  }
]
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "Sandbox Microphone"
      audio.position = [ MONO ]
      capture.props = {
        node.name = "sandbox-mic-capture"
        target.object = "sandbox-mic-feed"
        stream.capture.sink = true
        node.dont-reconnect = true
        node.passive = true
      }
      playback.props = {
        node.name = "sandbox-mic"
        media.class = "Audio/Source"
        priority.session = 2000
      }
    }
  }
]
