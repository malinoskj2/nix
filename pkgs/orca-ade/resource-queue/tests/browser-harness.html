<!doctype html><html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource Queue · browser integration tests</title><link rel="stylesheet" href="../panel/style.css"></head><body><main id="app"></main><script type="module">
import { fixture, fixtureTime } from './fixtures.mjs';
import { adaptStatus } from '../src/adapter.mjs';

let raw = fixture(), disconnected = false, controls = [];
Date.now = () => fixtureTime;
window.testBridge = { disconnect: () => { disconnected = true; }, reconnect: () => { disconnected = false; }, controls, raw };

    if (input.action === 'resume') raw.mode = 'normal';

  }
  throw new Error(`Unhandled test request ${name}`);
} } };
await import('../panel/app.mjs?v=3');
</script></body></html>
