<!doctype html>
<html lang="en" class="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resource Queue · backend contract fixture</title><link rel="stylesheet" href="../panel/style.css"></head>
<body><main id="app"></main><script type="module">
import { showFixture } from '../panel/app.mjs';
import { adaptStatus } from '../src/adapter.mjs';
const query = new URLSearchParams(location.search);
const capture = await fetch('./backend-status-v1.json').then((result) => result.json());
const raw = capture.scenarios[query.get('scenario') || 'exclusive_running'];
Date.now = () => raw.generated_at * 1000;
const snapshot = adaptStatus(raw);
if (query.get('theme') === 'light') document.documentElement.className = 'light';
showFixture(snapshot, { selected: snapshot.jobs.find((job) => job.exclusive)?.id });
</script></body></html>
